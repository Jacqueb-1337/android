name: Build root variant
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: golib/go.mod
          cache-dependency-path: golib/go.sum
      - name: Vet and test Go engine
        working-directory: golib
        run: |
          go vet ./...
          go test -race ./...

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: golib/go.mod
          cache-dependency-path: golib/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build gomobile engine and root helper
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./scripts/build-go.sh
          ./scripts/build-root-helper.sh
      - name: Assemble debug and release
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: net-merge-root-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

